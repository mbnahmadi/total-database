<!DOCTYPE html>
<html lang="fa">
<head>
  <meta charset="UTF-8">
  <title>نمایش دما - نقشه</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <style>
    html, body, #map { height: 100%; margin: 0; padding: 0; }
  </style>
</head>
<body>
  <div id="map"></div>

  <script>
    // ایجاد نقشه
    const map = L.map('map').setView([26.5, 54], 6);

    // بک‌گراند نقشه
    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 10,
      attribution: '&copy; OpenStreetMap contributors'
    }).addTo(map);

    // اضافه کردن لایه رستر دما
    const tempTiles = L.tileLayer('/tiles/{z}/{x}/{y}.png', {
      tms: false,
      opacity: 0.7,
      attribution: 'Temperature layer © TotalDB'
    }).addTo(map);
  </script>
</body>
</html>
